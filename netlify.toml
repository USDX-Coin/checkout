# Build
[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers — halaman ini pegang alur pembayaran, jadi origin sendiri + header ketat.
# Internal-only: checkout dicapai via top-level redirect dari `app` (BUKAN iframe) → DENY framing aman.
# Saat jalur partner masuk nanti: ganti `frame-ancestors 'none'` jadi allowlist per partner.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none';"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Env per context — isi nilai final di Netlify UI (Site settings → Environment variables).
# WAJIB host di bawah *.usdx.co.id (BUKAN railway.app langsung): checkout auth pakai cookie
# cross-subdomain `.usdx.co.id` (USDX-222) — cookie HANYA di-set & dikirim ke host *.usdx.co.id.
# Kalau base URL = railway.app (beda site), cookie tak akan ikut → GET /v2/mint/{id} 401.
# dev/preview → https://api-dev.usdx.co.id ; staging/prod → https://api.usdx.co.id (Netlify UI).
[context.deploy-preview.environment]
  NEXT_PUBLIC_API_BASE_URL = "https://api-dev.usdx.co.id"
[context.branch-deploy.environment]
  NEXT_PUBLIC_API_BASE_URL = "https://api-dev.usdx.co.id"
