# Build
[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers — halaman ini pegang alur pembayaran, jadi origin sendiri + header ketat.
# Internal-only: checkout dicapai via top-level redirect dari `app` (BUKAN iframe) → DENY framing aman.
# Saat jalur partner masuk nanti: ganti `frame-ancestors 'none'` jadi allowlist per partner.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none';"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Env per context — isi nilai final di Netlify UI (Site settings → Environment variables).
# dev/preview → backend dev; staging/prod → idealnya https://api.usdx.co.id (lihat USDX-222).
[context.deploy-preview.environment]
  NEXT_PUBLIC_API_BASE_URL = "https://usdx-backend-development.up.railway.app"
[context.branch-deploy.environment]
  NEXT_PUBLIC_API_BASE_URL = "https://usdx-backend-development.up.railway.app"
