# Build
[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Security headers — halaman ini pegang alur pembayaran + bearer token (handoff via URL hash,
# USDX-239), jadi origin sendiri + header ketat. `Referrer-Policy: strict-origin-when-cross-origin`
# (+ fragment hash TIDAK terkirim di Referer) membatasi kebocoran token. Internal-only: checkout
# dicapai via top-level redirect dari `app` (BUKAN iframe) → DENY framing aman.
# Saat jalur partner masuk nanti: ganti `frame-ancestors 'none'` jadi allowlist per partner.
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Content-Security-Policy = "frame-ancestors 'none';"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# Env build (NEXT_PUBLIC_*) di-set di Netlify UI per deploy context / branch —
# seragam dengan app & back-office (keputusan 2026-07-21). JANGAN tambah
# [context.*.environment] di sini: nilai netlify.toml menimpa nilai Netlify UI.
